; Borderlands 2 VR (6DoF) - configuracion
; Los cambios se aplican al reiniciar el juego.

[VR]
; 0 = desactiva el mod por completo (el juego arranca normal).
Enabled=1
; Unidades de Unreal por metro real. Mas alto = te sientes mas pequeño. En BL2 los ojos del
; personaje estan a 150 unidades del suelo, asi que 100 = tamaño real.
WorldScale=100
; Como se apunta: 2 = con el mando derecho (como un juego VR), 1 = con la cabeza,
; 0 = con el stick/raton (la cabeza mira libre).
AimMode=2
; Ajuste fino de la posicion del arma en la mano (unidades de Unreal ~ cm):
; adelante, derecha, arriba. El mod ya coloca la empuñadura en el mando; esto la desplaza.
GunOffsetForward=0
GunOffsetRight=0
GunOffsetUp=0
; Giro con el stick derecho: velocidad en grados por segundo. Con SnapTurn mayor que 0 se gira
; a saltos de esos grados (p. ej. 30), mas comodo si te mareas.
TurnSpeed=180
SnapTurn=0
; 1 = 6DoF (agacharte o inclinarte de verdad mueve la camara). 0 = solo rotacion + separacion de ojos.
PositionalTracking=1
; Resolucion por ojo. 0 = automatica (la mayor que quepa en tu monitor con el aspecto correcto).
RenderWidth=0
RenderHeight=0
; Multiplicador sobre la resolucion recomendada por el visor (solo con resolucion automatica).
ResolutionScale=1.0
; Quita el limite de 62 fps de Borderlands 2 (necesario para 72/90/120 Hz).
UncapFramerate=1
; Muestra el ojo derecho en la ventana del PC.
DesktopMirror=1
; Tamaño del HUD dentro de la vista (1.0 = pantalla completa, como en plano).
HudScale=0.6
; Distancia en metros a la que flota el HUD (0 = infinito).
HudDistance=2.0
; Los menus (pausa, inventario, tiendas...) se muestran en una pantalla virtual.
MenusOnScreen=1

[Keys]
; Codigos de tecla virtual de Windows. 117 = F6, 118 = F7.
; Recentrar la vista (mira al frente y pulsa).
Recenter=117
; Alternar VR estereo / pantalla virtual (modo cine).
ToggleStereo=118

[Debug]
; Deja esto como esta salvo que sepas lo que haces.
Use9On12=1
FakeHeadset=0
Trace=0
